<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-labelledby="t d">
  <title id="t">Zahlengerade von −5 bis 5</title>
  <desc id="d">Gerade mit gleichen Abschnitten. Die Null ist hervorgehoben, links davon stehen −1 bis −5, rechts 1 bis 5. Pfeile an beiden Enden.</desc>
  <style>text{font:16px sans-serif;fill:currentColor}line,path{stroke:currentColor;stroke-width:2;fill:none}</style>
  <line x1="20" y1="70" x2="620" y2="70"/><path d="M20 70l10-6m-10 6l10 6M620 70l-10-6m10 6l-10 6"/>
  <g text-anchor="middle">
    <line x1="70" y1="60" x2="70" y2="80"/><text x="70" y="104">−5</text>
    <line x1="140" y1="60" x2="140" y2="80"/><text x="140" y="104">−4</text>
    <line x1="210" y1="60" x2="210" y2="80"/><text x="210" y="104">−3</text>
    <line x1="280" y1="60" x2="280" y2="80"/><text x="280" y="104">−2</text>
    <line x1="350" y1="60" x2="350" y2="80"/><text x="350" y="104">−1</text>
    <line x1="420" y1="50" x2="420" y2="90" style="stroke-width:4"/><text x="420" y="104" font-weight="bold">0</text>
    <line x1="490" y1="60" x2="490" y2="80"/><text x="490" y="104">1</text>
    <line x1="560" y1="60" x2="560" y2="80"/><text x="560" y="104">2</text>
    <text x="210" y="36">negative Zahlen</text><text x="540" y="36">positive Zahlen</text>
  </g>
</svg>
