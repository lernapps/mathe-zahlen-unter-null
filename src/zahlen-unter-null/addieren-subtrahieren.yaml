# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Addieren und Subtrahieren als Bewegung
description: Auf der Zahlengerade nach rechts und links gehen, auch bei negativen Zahlen und beim Subtrahieren einer negativen Zahl.
competencies: [rationale-zahlen-rechnen]
blocks:
  - type: section
    id: einstieg
    title: Die Kasse wird kleiner
    blocks:
      - type: text
        text: |
          **Tomás:** In der Materialkasse sind 8 €. Wir kaufen Stifte für 5 €. Das ist eine Änderung um −5 €.

          **Mara:** Dann rechnen wir 8 + (−5). Die Klammer zeigt: Das Minus gehört zur Zahl −5, es ist kein Rechenzeichen. Eine negative Zahl addieren heißt, auf der Zahlengerade so viele Abschnitte nach links zu gehen: Von 8 gehst du 5 Abschnitte nach links.
      - type: single-choice
        id: kasse-rechnen
        text: Wie viel Euro sind danach in der Kasse, wenn du 8 + (−5) rechnest?
        options:
          - text: 13 €
            correct: false
            info: Das wäre 8 + 5. Die Klammer (−5) heißt, dass 5 € weggehen.
          - text: 3 €
            correct: true
            info: 8 + (−5) ist dasselbe wie 8 − 5, also 3.
          - text: −3 €
            correct: false
            info: Du hast 8 und 5 vertauscht. Die Kasse hat mehr als sie ausgibt, also bleibt etwas übrig.
        explanation: Plus eine negative Zahl heißt, nach links zu gehen. Von 8 fünf Abschnitte nach links ist 3.
  - type: section
    id: beispiel
    title: Rechnen heißt gehen
    blocks:
      - type: text
        text: |
          Wenn du Einnahmen und Ausgaben verrechnen willst, kannst du auf der Zahlengerade gehen. Addierst du eine positive Zahl, gehst du nach rechts. Addierst du eine negative Zahl, gehst du nach links. Bei 2 + (−5) startest du bei 2 und gehst 5 Abschnitte nach links. Subtrahierst du eine positive Zahl, gehst du auch nach links, wenn nötig über die Null: 2 − 6 = −4.
      - type: figure
        image: images/pfeil-plus.svg
        alt: Zahlengerade von minus 6 bis 6. Ein gestrichelter Pfeil startet bei 2 und geht fünf Abschnitte nach links, mit der Beschriftung plus Klammer minus 5.
        caption: Der Pfeil zeigt die Rechnung 2 + (−5). Wo er endet, steht das Ergebnis.
        source: eigene Zeichnung
        licence: CC0-1.0
      - type: text
        text: |
          Wenn du eine negative Zahl abziehen musst, fehlt dir eine Regel dafür. Ein Zahlenmuster zeigt sie dir. Die Zahl, die du abziehst, wird immer um 1 kleiner. Das Ergebnis wird dann immer um 1 größer, denn wer weniger abzieht, behält mehr. Eine negative Zahl abzuziehen heißt, die Zahlengerade nach rechts zu gehen. Das Muster geht nach unten über die Null in den negativen Bereich weiter.
      - type: table
        caption: Muster beim Subtrahieren
        header: ["Aufgabe", "Ergebnis"]
        rows:
          - ["4 − 2", "2"]
          - ["4 − 1", "3"]
          - ["4 − 0", "4"]
          - ["4 − (−1)", "5"]
          - ["4 − (−2)", "6"]
      - type: figure
        image: images/pfeil-minus.svg
        alt: Zahlengerade von minus 6 bis 6. Ein gestrichelter Pfeil startet bei minus 2 und geht drei Abschnitte nach rechts, mit der Beschriftung minus Klammer minus 3.
        caption: Der Pfeil zeigt die Rechnung −2 − (−3). Eine negative Zahl abziehen heißt nach rechts gehen.
        source: eigene Zeichnung
        licence: CC0-1.0
  - type: section
    id: merke
    title: Merke
    blocks:
      - type: note
        title: Zwei Minus nebeneinander
        blocks:
          - type: text
            text: |
              Eine negative Zahl addieren heißt, ihren Betrag abzuziehen: 8 + (−5) = 8 − 5. Eine negative Zahl subtrahieren heißt, ihre Gegenzahl zu addieren: 4 − (−1) = 4 + 1.
  - type: section
    id: uebung
    title: Aufgaben
    blocks:
      - type: number
        id: minus-vier-plus-sieben
        text: Berechne −4 + 7.
        answer: 3
        tolerance: 0
        mistakes:
          - answer: -11
            message: Du hast die Beträge addiert und das Minus behalten. Starte bei −4 und gehe 7 Abschnitte nach rechts.
          - answer: 11
            message: Du hast das Minus von −4 ignoriert. Starte bei −4, nicht bei 4.
        explanation: Von −4 sieben Abschnitte nach rechts landest du bei 3.
      - type: single-choice
        id: sechs-minus-minus-zwei
        text: Was ergibt 6 − (−2)?
        options:
          - text: "4"
            correct: false
            info: Das wäre 6 − 2. Du hast die beiden Minus nicht zusammengefasst.
          - text: "8"
            correct: true
            info: 6 − (−2) = 6 + 2, denn eine negative Zahl abziehen heißt nach rechts gehen.
          - text: "−8"
            correct: false
            info: Das Ergebnis ist positiv. Von 6 aus gehst du nach rechts, nicht über die Null hinaus nach links.
        explanation: "Minus vor einer negativen Zahl wird zu Plus: 6 − (−2) = 6 + 2."
      - type: generated
        id: plus-negativ
        given:
          a: { int: [1, 9] }
          b: { int: [1, 9] }
        where: ["a != b"]
        task:
          text: "Berechne {{a}} + (−{{b}})."
        answer: { value: "a - b", compare: { number: { format: integer } } }
        mistakes:
          - value: "a + b"
            message: "Du hast {{b}} addiert. Die Klammer (−{{b}}) heißt: um {{b}} nach links gehen."
          - value: "b - a"
            message: "Das Vorzeichen stimmt nicht: Du hast {{b}} − {{a}} gerechnet. Starte bei {{a}} und gehe {{b}} nach links."
        hint: "Starte bei der ersten Zahl und gehe so viele Abschnitte nach links, wie die Klammer sagt."
        steps:
          - "{{a}} + (−{{b}}) ist dasselbe wie {{a}} − {{b}}."
          - "Von {{a}} gehst du um {{b}} nach links und landest bei {{answer}}."
      - type: generated
        id: minus-negativ
        given:
          a: { int: [1, 9] }
          b: { int: [1, 9] }
        task:
          text: "Berechne {{a}} − (−{{b}})."
        answer: { value: "a + b", compare: { number: { format: integer } } }
        mistakes:
          - value: "a - b"
            message: "Du hast die beiden Minus nicht zusammengefasst. Eine negative Zahl abziehen heißt: ihre Gegenzahl addieren."
          - value: "0 - a - b"
            message: "Das Ergebnis ist positiv: Du gehst von {{a}} aus um {{b}} nach rechts."
        hint: "Subtrahieren von (−{{b}}) ist Addieren von {{b}}."
        steps:
          - "{{a}} − (−{{b}}) ist dasselbe wie {{a}} + {{b}}."
          - "Von {{a}} gehst du um {{b}} nach rechts und landest bei {{answer}}."
      - type: generated
        id: negativ-minus-positiv
        given:
          a: { int: [1, 9] }
          b: { int: [1, 9] }
        task:
          text: "Berechne −{{a}} − {{b}}."
        answer: { value: "0 - a - b", compare: { number: { format: integer } } }
        mistakes:
          - value: "a - b"
            message: "Du hast das Minus vor {{a}} vergessen. Starte bei −{{a}}, links der Null."
          - value: "a + b"
            message: "Das Ergebnis liegt links der Null: Von −{{a}} gehst du um {{b}} weiter nach links."
        hint: "Starte bei −{{a}} und gehe um {{b}} nach links."
        steps:
          - "Von −{{a}} gehst du um {{b}} nach links."
          - "Du landest bei {{answer}}."
