# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Was du aus früheren Klassen für dieses Kapitel können musst, mit Begriffen, Beispielen und zwei Übungen.
recap: [mathematik/natuerliche-zahlen, mathematik/brueche-multiplizieren-dividieren]
blocks:
  - type: section
    id: einstieg
    title: Das brauchst du für dieses Kapitel
    blocks:
      - type: text
        text: |
          Wenn du mit Zahlen unter null rechnen willst, musst du zwei Dinge aus früheren Klassen sicher können. Lies jeden Abschnitt und löse die zwei Übungen, dann weißt du, ob du bereit bist.
  - type: section
    id: natuerliche-zahlen
    title: Natürliche Zahlen im Stellenwertsystem
    blocks:
      - type: text
        text: |
          Wenn du Zahlen vergleichen und ihren Abstand von der Null bestimmen willst, musst du Zahlen sicher lesen können. Ich kann natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen.
      - type: definition
        term: Zahlenstrahl
        explanation: Der Zahlenstrahl beginnt bei der Null und geht nach rechts weiter. Auf ihm stehen nur Zahlen ab 0, zum Beispiel 0, 1, 2, 3, mit gleichen Abschnitten.
      - type: definition
        term: Stellenwert
        explanation: Der Stellenwert einer Ziffer sagt, wie viel sie in der Zahl wert ist. Er hängt von ihrer Stelle ab. Von rechts nach links stehen Einer, Zehner, Hunderter, Tausender, Zehntausender, Hunderttausender. In 3482 steht die 4 an der Hunderterstelle, sie ist also 400 wert.
      - type: number
        id: stellenwert-pruefen
        text: Welchen Wert hat die 7 in der Zahl 470 583?
        answer: 70000
        tolerance: 0
        mistakes:
          - answer: 7000
            message: Das wäre die Tausenderstelle. Die 7 steht eine Stelle weiter links, an der Zehntausenderstelle.
          - answer: 700000
            message: Das wäre die Hunderttausenderstelle. Dort steht die 4.
        explanation: "Von rechts: Einer 3, Zehner 8, Hunderter 5, Tausender 0, Zehntausender 7. Die 7 ist 7 · 10 000 = 70 000 wert."
      - type: text
        text: |
          Fällt dir die Übung schwer? Dann übe den Baustein „Natürliche Zahlen im Stellenwertsystem“, seine Kartenseite: [Natürliche Zahlen im Stellenwertsystem](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/).
  - type: section
    id: brueche
    title: Bruchrechnung, Multiplikation und Division
    blocks:
      - type: text
        text: |
          Wenn du später mit Brüchen unter null rechnest, brauchst du das Multiplizieren und Dividieren von Brüchen. Ich kann Brüche multiplizieren und dividieren.
      - type: definition
        term: Bruch
        explanation: Ein Bruch wie $\frac{3}{4}$ hat einen Zähler (oben) und einen Nenner (unten). Der Nenner sagt, in wie viele gleiche Teile das Ganze geteilt ist, der Zähler, wie viele Teile gemeint sind. $\frac{3}{4}$ sind drei von vier gleichen Teilen.
      - type: definition
        term: Kürzen
        explanation: Kürzen heißt, Zähler und Nenner durch dieselbe Zahl zu teilen. Der Wert bleibt gleich. Beispiel $\frac{6}{8} = \frac{3}{4}$, beide durch 2 geteilt.
      - type: text
        text: |
          Beim Multiplizieren rechnest du Zähler mal Zähler und Nenner mal Nenner. Beim Dividieren multiplizierst du mit dem Kehrbruch.
      - type: example
        title: Zwei Beispiele
        blocks:
          - type: formula
            formula: '\frac{2}{3} \cdot \frac{3}{5} = \frac{6}{15} = \frac{2}{5}'
          - type: formula
            formula: '\frac{1}{2} : \frac{1}{4} = \frac{1}{2} \cdot \frac{4}{1} = 2'
      - type: definition
        term: Kehrbruch
        explanation: Der Kehrbruch entsteht, wenn du Zähler und Nenner vertauschst. Der Kehrbruch von $\frac{1}{4}$ ist $\frac{4}{1} = 4$, denn durch $\frac{1}{4}$ zu teilen heißt, zu fragen, wie oft ein Viertel hineinpasst.
      - type: definition
        term: Gleichnamig machen
        explanation: Brüche gleichnamig machen heißt, sie auf denselben Nenner zu bringen, ohne ihren Wert zu ändern. Dazu erweiterst du. Das heißt, Zähler und Nenner mit derselben Zahl zu multiplizieren. Beispiel $\frac{1}{2} = \frac{3}{6}$ (mit 3 erweitert) und $\frac{1}{3} = \frac{2}{6}$ (mit 2 erweitert), beide haben jetzt den Nenner 6.
      - type: definition
        term: Dezimalzahl
        explanation: Eine Dezimalzahl schreibt einen Bruch mit dem Nenner 10, 100, 1000, … mit Komma. Beispiel $\frac{3}{4}$ hat noch keinen solchen Nenner, mit 25 erweitert wird daraus $\frac{75}{100} = 0{,}75$. Die Stellen nach dem Komma sind Zehntel, Hundertstel, …
      - type: single-choice
        id: bruch-dividieren
        text: "Was ergibt $\\frac{2}{3} : \\frac{4}{9}$?"
        options:
          - text: "$\\frac{3}{2}$"
            correct: true
            info: "Durch $\\frac{4}{9}$ teilen heißt mit $\\frac{9}{4}$ malnehmen: $\\frac{2}{3} \\cdot \\frac{9}{4} = \\frac{18}{12}$, gekürzt $\\frac{3}{2}$."
          - text: "$\\frac{8}{27}$"
            correct: false
            info: "Das wäre $\\frac{2}{3} \\cdot \\frac{4}{9}$. Beim Teilen musst du den zweiten Bruch umkehren."
          - text: "$\\frac{2}{3}$"
            correct: false
            info: "Du hast den ersten Bruch umgekehrt statt den zweiten. Umkehren musst du den Bruch, durch den du teilst."
        explanation: "Teilen durch einen Bruch heißt, mit seinem Kehrbruch zu multiplizieren."
      - type: text
        text: |
          Fällt dir die Übung schwer? Dann übe den Baustein „Bruchrechnung: Multiplikation und Division“, seine Kartenseite: [Bruchrechnung: Multiplikation und Division](https://lernapps.net/apps/map/mathematik/c/brueche-multiplizieren-dividieren/).
  - type: section
    id: checkliste
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen kannst, auch auf dem Zahlenstrahl,
          - Brüche multiplizieren, dividieren und kürzen kannst,
          - einen Bruch wie sieben Achtel als Dezimalzahl 0,875 schreiben kannst.
