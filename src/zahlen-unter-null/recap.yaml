# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Was du aus früheren Klassen für dieses Kapitel können musst, mit Begriffen, Beispielen und je einem Kurztest.
recap: [mathematik/natuerliche-zahlen, mathematik/brueche-multiplizieren-dividieren]
blocks:
  - type: section
    id: einstieg
    title: Das brauchst du für dieses Kapitel
    blocks:
      - type: text
        text: |
          Für „Zahlen unter null“ brauchst du zwei Dinge aus früheren Klassen. Lies jeden Abschnitt und mach den Kurztest. Nichts wird gezählt oder gespeichert.
  - type: section
    id: natuerliche-zahlen
    title: Natürliche Zahlen im Stellenwertsystem
    blocks:
      - type: text
        text: |
          Ich kann natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen.
      - type: definition
        term: Zahlenstrahl
        explanation: Der Zahlenstrahl beginnt bei der Null und geht nach rechts weiter. Auf ihm stehen nur Zahlen ab 0, zum Beispiel 0, 1, 2, 3, mit gleichen Abschnitten.
      - type: definition
        term: Stellenwert
        explanation: Der Stellenwert einer Ziffer sagt, wie viel sie in der Zahl wert ist. Er hängt von ihrer Stelle ab. Von rechts nach links stehen Einer, Zehner, Hunderter, Tausender, Zehntausender, Hunderttausender. In 3482 steht die 4 an der Hunderterstelle, sie ist also 400 wert.
      - type: vue-component
        id: kurztest-stellenwert
        component: Kurztest
        props:
          question: "Welchen Wert hat die 7 in der Zahl 470 583?"
          options:
            - {
                text: "7 000",
                correct: false,
                info: "Das wäre die Tausenderstelle. Die 7 steht eine Stelle weiter links, an der Zehntausenderstelle.",
              }
            - {
                text: "70 000",
                correct: true,
                info: "Von rechts: Einer 3, Zehner 8, Hunderter 5, Tausender 0, Zehntausender 7. Die 7 ist 7 · 10 000 = 70 000 wert.",
              }
            - { text: "700 000", correct: false, info: "Das wäre die Hunderttausenderstelle. Dort steht die 4." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welchen Wert hat die 7 in der Zahl 470 583? Zur Wahl stehen 7 000, 70 000 und 700 000. Antwort: 70 000, denn die 7 steht an der Zehntausenderstelle.
      - type: vue-component
        id: kurztest-stellenwert-zwei
        component: Kurztest
        props:
          question: "Wie schreibst du „dreißigtausendzweihundertsieben“ mit Ziffern?"
          options:
            - { text: "30 207", correct: true, info: "3 Zehntausender, 0 Tausender, 2 Hunderter, 0 Zehner, 7 Einer." }
            - {
                text: "30 270",
                correct: false,
                info: "Das sind 7 Zehner und 0 Einer. Gesprochen ist es aber 7 Einer, also ohne Zehner.",
              }
            - {
                text: "3207",
                correct: false,
                info: "Das wäre dreitausendzweihundertsieben. Hier fehlt die Zehntausenderstelle.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Wie schreibst du dreißigtausendzweihundertsieben mit Ziffern? Zur Wahl stehen 30 207, 30 270 und 3207. Antwort: 30 207, denn es sind 3 Zehntausender, 0 Tausender, 2 Hunderter, 0 Zehner und 7 Einer.
      - type: text
        text: |
          Hattest du den Kurztest nicht richtig oder bist du unsicher? Auf der Lernlandkarte von lernapps.net ist das Können in Bausteine geordnet. Übe den Baustein „Natürliche Zahlen im Stellenwertsystem“, seine Kartenseite: [Natürliche Zahlen im Stellenwertsystem](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/).
  - type: section
    id: brueche
    title: Bruchrechnung, Multiplikation und Division
    blocks:
      - type: text
        text: |
          Ich kann Brüche multiplizieren und dividieren.
      - type: definition
        term: Bruch
        explanation: Ein Bruch wie $\frac{3}{4}$ hat einen Zähler (oben) und einen Nenner (unten). Der Nenner sagt, in wie viele gleiche Teile das Ganze geteilt ist, der Zähler, wie viele Teile gemeint sind. $\frac{3}{4}$ sind drei von vier gleichen Teilen.
      - type: definition
        term: Kürzen
        explanation: Kürzen heißt, Zähler und Nenner durch dieselbe Zahl zu teilen. Der Wert bleibt gleich. Beispiel $\frac{6}{8} = \frac{3}{4}$, beide durch 2 geteilt.
      - type: text
        text: |
          Beim Multiplizieren rechnest du Zähler mal Zähler und Nenner mal Nenner. Beim Dividieren multiplizierst du mit dem Kehrbruch.
      - type: example
        title: Zwei Beispiele
        blocks:
          - type: formula
            formula: '\frac{2}{3} \cdot \frac{3}{5} = \frac{6}{15} = \frac{2}{5}'
          - type: formula
            formula: '\frac{1}{2} : \frac{1}{4} = \frac{1}{2} \cdot \frac{4}{1} = 2'
      - type: definition
        term: Kehrbruch
        explanation: Der Kehrbruch entsteht, wenn du Zähler und Nenner vertauschst. Der Kehrbruch von $\frac{1}{4}$ ist $\frac{4}{1} = 4$, denn durch $\frac{1}{4}$ zu teilen heißt, zu fragen, wie oft ein Viertel hineinpasst.
      - type: definition
        term: Gleichnamig machen
        explanation: Brüche gleichnamig machen heißt, sie auf denselben Nenner zu bringen, ohne ihren Wert zu ändern. Dazu erweiterst du. Das heißt, Zähler und Nenner mit derselben Zahl zu multiplizieren. Beispiel $\frac{1}{2} = \frac{3}{6}$ (mit 3 erweitert) und $\frac{1}{3} = \frac{2}{6}$ (mit 2 erweitert), beide haben jetzt den Nenner 6.
      - type: definition
        term: Dezimalzahl
        explanation: Eine Dezimalzahl schreibt einen Bruch mit dem Nenner 10, 100, 1000, … mit Komma. Beispiel $\frac{3}{4}$ hat noch keinen solchen Nenner, mit 25 erweitert wird daraus $\frac{75}{100} = 0{,}75$. Die Stellen nach dem Komma sind Zehntel, Hundertstel, …
      - type: vue-component
        id: kurztest-brueche
        component: Kurztest
        props:
          question: "Was ergibt 12/35 · 14/9, ganz gekürzt?"
          options:
            - {
                text: "8/15",
                correct: true,
                info: "12 · 14 = 168 und 35 · 9 = 315, also 168/315. Gekürzt durch 21 ist das 8/15.",
              }
            - {
                text: "13/22",
                correct: false,
                info: "Du hast Zähler und Nenner addiert (12 + 14 und 35 + 9) und gekürzt. Beim Multiplizieren rechnest du mal.",
              }
            - {
                text: "168/315",
                correct: false,
                info: "Der Wert stimmt, aber der Bruch ist noch nicht ganz gekürzt. Teile Zähler und Nenner durch dieselbe Zahl, bis es nicht mehr geht.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Was ergibt zwölf Fünfunddreißigstel mal vierzehn Neuntel, ganz gekürzt? Zur Wahl stehen acht Fünfzehntel, dreizehn Zweiundzwanzigstel und 168 Dreihundertfünfzehntel. Antwort: acht Fünfzehntel. 12 · 14 = 168 und 35 · 9 = 315, also 168 Dreihundertfünfzehntel, gekürzt durch 21 acht Fünfzehntel.
      - type: vue-component
        id: kurztest-dividieren
        component: Kurztest
        props:
          question: "Was ergibt 2/3 : 4/9?"
          options:
            - {
                text: "3/2",
                correct: true,
                info: "Durch 4/9 teilen heißt mit 9/4 malnehmen: 2/3 · 9/4 = 18/12, gekürzt 3/2.",
              }
            - {
                text: "8/27",
                correct: false,
                info: "Das wäre 2/3 · 4/9. Beim Teilen musst du den zweiten Bruch umkehren.",
              }
            - {
                text: "2/3",
                correct: false,
                info: "Du hast den ersten Bruch umgekehrt statt den zweiten. Umkehren musst du den Bruch, durch den du teilst.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Was ergibt zwei Drittel geteilt durch vier Neuntel? Zur Wahl stehen drei Halbe, acht Siebenundzwanzigstel und zwei Drittel. Antwort: drei Halbe. Teilen durch vier Neuntel heißt Malnehmen mit neun Viertel: zwei Drittel mal neun Viertel gleich achtzehn Zwölftel, gekürzt drei Halbe.
      - type: vue-component
        id: kurztest-dezimal
        component: Kurztest
        props:
          question: "Wie schreibst du 7/8 als Dezimalzahl?"
          options:
            - { text: "0,875", correct: true, info: "7/8 mit 125 erweitert ist 875/1000, und das ist 0,875." }
            - {
                text: "0,78",
                correct: false,
                info: "Du hast Zähler und Nenner einfach nebeneinandergeschrieben. Erweitere auf den Nenner 1000.",
              }
            - {
                text: "0,7",
                correct: false,
                info: "0,7 sind sieben Zehntel, das ist 7/10 und ein bisschen weniger als 7/8.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Wie schreibst du sieben Achtel als Dezimalzahl? Zur Wahl stehen 0,875, 0,78 und 0,7. Antwort: 0,875, denn sieben Achtel mit 125 erweitert sind 875 Tausendstel.
      - type: text
        text: |
          Hattest du den Kurztest nicht richtig oder bist du unsicher? Übe den Baustein „Bruchrechnung: Multiplikation und Division“, seine Kartenseite: [Bruchrechnung: Multiplikation und Division](https://lernapps.net/apps/map/mathematik/c/brueche-multiplizieren-dividieren/).
  - type: section
    id: checkliste
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen kannst, auch auf dem Zahlenstrahl,
          - Brüche multiplizieren, dividieren und kürzen kannst,
          - einen Bruch wie sieben Achtel als Dezimalzahl 0,875 schreiben kannst.
