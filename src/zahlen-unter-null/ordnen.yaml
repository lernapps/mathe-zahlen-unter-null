# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Negative Zahlen ordnen und vergleichen
description: Zahlen auf der Zahlengerade vergleichen und der Größe nach ordnen, auch wenn sie negativ sind.
competencies: [rationale-zahlen]
blocks:
  - type: section
    id: einstieg
    title: Welcher Tag war kälter?
    blocks:
      - type: text
        text: |
          **Mara:** Montag waren es −2 °C, Dienstag −5 °C.

          **Tomás:** Ich bin nicht sicher, welcher Tag kälter war. 5 ist doch mehr als 2.
      - type: single-choice
        id: kaelter
        text: An welchem Tag war es kälter, am Montag mit −2 °C oder am Dienstag mit −5 °C?
        options:
          - text: Am Montag
            correct: false
            info: "−2 °C liegt näher an der Null als −5 °C. Bei Temperaturen unter null ist es kälter, je weiter unten der Wert liegt."
          - text: Am Dienstag
            correct: true
            info: "−5 °C liegt weiter unter der Null als −2 °C. Darum war es am Dienstag kälter."
        explanation: Auf einem Thermometer ist es kälter, je weiter unten der Wert liegt. Dienstag liegt weiter unten.
  - type: section
    id: beispiel
    title: Links ist kleiner
    blocks:
      - type: figure
        image: images/zahlengerade.svg
        alt: Zahlengerade von minus 6 bis 6 mit gleichen Abschnitten. Die Null ist fett. Links der Null stehen die negativen Zahlen, rechts die positiven.
        caption: Suche −5 und −2 auf der Zahlengerade. Die Zahl, die weiter links steht, ist kleiner.
        source: eigene Zeichnung
        licence: CC0-1.0
      - type: text
        text: |
          Wenn du wissen willst, welche von zwei Zahlen kleiner ist, schaust du auf die Zahlengerade. Dort steht von zwei Zahlen die **kleinere** weiter links. −5 liegt links von −2, also gilt −5 < −2. Gelesen: „minus 5 ist kleiner als minus 2“.
      - type: example
        title: Drei Zahlen ordnen
        blocks:
          - type: text
            text: |
              Wenn du mehrere Zahlen ordnen musst, legst du sie auf die Zahlengerade. Ordne −1, 3 und −4 von klein nach groß. Von links nach rechts auf der Zahlengerade stehen: −4, −1, 3. Also gilt −4 < −1 < 3.
  - type: section
    id: merke
    title: Merke
    blocks:
      - type: note
        title: Zwei negative Zahlen vergleichen
        blocks:
          - type: text
            text: |
              Jede negative Zahl ist kleiner als jede positive Zahl und kleiner als 0. Von zwei negativen Zahlen ist die kleiner, die weiter von der Null entfernt liegt. −9 ist also kleiner als −3, obwohl 9 größer als 3 ist.
  - type: section
    id: uebung
    title: Aufgaben
    blocks:
      - type: true-false
        id: groesser-als
        text: "Es gilt −2 > −5."
        answer: true
        explanation: −2 liegt rechts von −5 auf der Zahlengerade, also ist −2 größer.
      - type: ordering
        id: zahlen-ordnen
        text: Ordne die Zahlen von der kleinsten zur größten.
        items: ["−7", "−3", "0", "2"]
        explanation: Von links nach rechts auf der Zahlengerade stehen −7, −3, 0 und 2.
      - type: single-choice
        id: meerestiefe
        text: Ein Tauchroboter ist auf −40 m, ein anderer auf −25 m (Höhe über oder unter dem Meeresspiegel). Welcher ist tiefer?
        options:
          - text: Der bei −25 m
            correct: false
            info: −25 m liegt näher am Meeresspiegel, also höher.
          - text: Der bei −40 m
            correct: true
            info: −40 m liegt weiter unter dem Meeresspiegel, also tiefer.
          - text: Beide gleich tief
            correct: false
            info: Die Zahlen sind verschieden, also liegen die Roboter verschieden tief.
        explanation: Tiefer heißt kleiner. −40 ist kleiner als −25.
      - type: generated
        id: kleinere-zahl
        given:
          e: { pick: 1, from: { data: zahlen } }
          f: { pick: 1, from: { data: zahlen } }
        where: ["e.wert < 0", "f.wert < 0", "e.wert != f.wert"]
        task:
          text: "Welche Zahl ist kleiner, −{{e.betrag}} oder −{{f.betrag}}? Gib die kleinere Zahl an."
        answer: { value: "sortBy([e, f], wert)[0].wert", compare: { number: { format: integer } } }
        mistakes:
          - value: "sortBy([e, f], betrag)[0].wert"
            message: "Du hast die Zahl mit der kleineren Ziffer genommen. Bei negativen Zahlen ist die kleiner, die weiter links liegt."
        hint: "Welche der beiden Zahlen liegt auf der Zahlengerade weiter links?"
        steps:
          - "Beide Zahlen sind negativ. Die kleinere liegt weiter links."
          - "Die kleinere Zahl ist {{answer}}."
